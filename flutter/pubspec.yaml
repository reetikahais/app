name: raahmitra_gps_logger
description: Throwaway GPS background-reliability logger (Flutter side of RN vs Flutter test)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.6
  flutter_local_notifications: ^17.2.3
  geolocator: ^11.0.0
  battery_plus: ^7.1.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  share_plus: ^13.3.0
  cross_file: any
  signal_info:
    path: packages/signal_info

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
